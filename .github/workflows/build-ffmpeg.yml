name: Build FFmpeg for Windows

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          cache: false
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-yasm
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-bzip2
            mingw-w64-x86_64-xz
            mingw-w64-x86_64-x264
            mingw-w64-x86_64-x265
            mingw-w64-x86_64-libvpx
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libtheora
            mingw-w64-x86_64-lame
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-fontconfig
            mingw-w64-x86_64-libass
            mingw-w64-x86_64-fribidi
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-SDL2

      - name: Pull latest submodules
        run: git submodule update --init --recursive || true

      - name: Configure FFmpeg
        run: |
          ./configure \
            --prefix=$MSYSTEM_PREFIX \
            --enable-gpl \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libvpx \
            --enable-libmp3lame \
            --enable-libopus \
            --enable-libvorbis \
            --enable-libtheora \
            --enable-libfreetype \
            --enable-libfontconfig \
            --enable-libfribidi \
            --enable-libharfbuzz \
            --enable-libass \
            --enable-sdl2 \
            --enable-ffplay \
            --disable-debug

      - name: Build
        run: |
          make -j$(nproc)
          make install && echo "build-installed"

      - name: Collect exes and dependency DLLs
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          rm -rf dist
          mkdir -p dist
          cp -f ffmpeg.exe ffprobe.exe ffplay.exe dist/ 2>/dev/null || true
          # FFmpeg 自己生成的 dll 就构建在仓库根
          cp -f libavcodec/*.dll libavformat/*.dll libavutil/*.dll libavfilter/*.dll libswscale/*.dll libswresample/*.dll libavdevice/*.dll libpostproc/*.dll dist/ 2>/dev/null || true
          # 收集 exe 依赖的其它 mingw dll（供运行时）
          for exe in ffmpeg ffprobe ffplay; do
            ldd "$exe.exe" 2>/dev/null | awk '{print $3}' | while read dll; do
              if [ -n "$dll" ] && [ -f "$dll" ] && [[ "$dll" = *.dll ]]; then
                cp -f "$dll" dist/ 2>/dev/null || true
              fi
            done
          done
          echo "=== dist contents ==="
          ls -la dist/
          find dist -name "*.dll" | wc -l | xargs echo "dll count:"

      - name: Package zip (PowerShell)
        shell: powershell
        run: |
          $ver = "${{ github.sha }}".Substring(0,7)
          $dist = "$env:GITHUB_WORKSPACE\dist"
          $zip = "$env:GITHUB_WORKSPACE\ffmpeg-windows-$ver.zip"
          if (-not (Test-Path "$dist\ffmpeg.exe")) { throw "ffmpeg.exe missing in dist" }
          Get-ChildItem $dist | ForEach-Object { Write-Output "zip-in: $($_.Name) ($($_.Length) bytes)" }
          Compress-Archive -Path "$dist\*" -DestinationPath $zip -Force
          Write-Output "ZIP=$zip"
          Write-Output ("zip size: " + [math]::Round((Get-Item $zip).Length/1MB,1) + " MB")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows
          path: dist/
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          files: ffmpeg-windows-*.zip